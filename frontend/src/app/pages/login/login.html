<main class="login-page">
    <section
        class="login-card"
        aria-labelledby="login-title"
    >
        <div class="login-brand">
            <div
                class="login-brand-mark"
                aria-hidden="true"
            >
                AC
            </div>

            <div>
                <div class="login-brand-name">
                    Colony Manager
                </div>

                <div class="login-brand-subtitle">
                    Animal Research Colony
                </div>
            </div>
        </div>

        <h1
            id="login-title"
            class="login-title"
        >
            Welcome back
        </h1>

        <p class="login-description">
            Sign in to manage animals, cages,
            husbandry events, and colony coverage.
        </p>

        <button
            type="button"
            class="login-button"
            (click)="login()"
        >
            Sign in with GitHub
        </button>

        <p class="login-note">
            Access is limited to authorized
            colony personnel.
        </p>
    </section>
</main>
